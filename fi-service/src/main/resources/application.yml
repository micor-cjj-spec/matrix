spring:
  application:
    name: fi-service

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  config:
    import: "optional:nacos:${spring.application.name}"

  rabbitmq:
    host: ${RABBITMQ_HOST:127.0.0.1}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        acknowledge-mode: manual
        default-requeue-rejected: false

  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:117.72.216.168:8848}
        group: ${NACOS_GROUP:DEV_GROUP}
        namespace: ${NACOS_NAMESPACE:public}
      config:
        server-addr: ${NACOS_ADDR:117.72.216.168:8848}
        file-extension: yaml
        group: ${NACOS_GROUP:DEV_GROUP}
        namespace: ${NACOS_NAMESPACE:public}

matrix:
  openapi:
    internal-token: ${MATRIX_INTERNAL_OPENAPI_TOKEN:}
  ai-tool:
    internal-token: ${FINANCE_AI_TOOL_INTERNAL_TOKEN:}
    max-check-items: ${FINANCE_AI_TOOL_MAX_CHECK_ITEMS:20}
    max-warnings: ${FINANCE_AI_TOOL_MAX_WARNINGS:20}
    audit-internal-token: ${FINANCE_AI_AUDIT_INTERNAL_TOKEN:}
    audit-reconciliation-enabled: ${FINANCE_AI_AUDIT_RECONCILIATION_ENABLED:true}
    audit-started-timeout-minutes: ${FINANCE_AI_AUDIT_STARTED_TIMEOUT_MINUTES:15}
    audit-reconciliation-delay-ms: ${FINANCE_AI_AUDIT_RECONCILIATION_DELAY_MS:300000}
    audit-reconciliation-batch-size: ${FINANCE_AI_AUDIT_RECONCILIATION_BATCH_SIZE:100}
  scheduler:
    client:
      enabled: true
      executor-code: fi-service
      executor-name: 财务服务执行器
      scheduler-base-url: ${SCHEDULER_BASE_URL:http://127.0.0.1:8080/api}
      internal-token: ${SCHEDULER_INTERNAL_TOKEN:change-me-before-production}
      concurrency: ${FI_SCHEDULER_CONCURRENCY:2}
      max-concurrency: ${FI_SCHEDULER_MAX_CONCURRENCY:8}
      heartbeat-interval-ms: 30000
      initialize-schema: true

fi:
  reconciliation:
    internal-token: ${FI_RECONCILIATION_INTERNAL_TOKEN:change-me-before-production}
  accounting:
    default-book-id: ${FI_ACCOUNTING_DEFAULT_BOOK_ID:DEFAULT}
    purchase-inbound-consumer-code: ${FI_PURCHASE_INBOUND_CONSUMER_CODE:FI_PURCHASE_INBOUND_ACCOUNTING_V1}
  workflow:
    base-url: ${FI_WORKFLOW_BASE_URL:http://localhost:10006/api}
    callback-url: ${FI_WORKFLOW_CALLBACK_URL:http://localhost:10003/api/fi/expense/workflow/events}
    callback-secret: ${WORKFLOW_CALLBACK_SECRET:change-me-in-production}
    callback-max-skew-seconds: ${WORKFLOW_CALLBACK_MAX_SKEW_SECONDS:300}
    outbox:
      batch-size: ${FI_WORKFLOW_OUTBOX_BATCH_SIZE:20}
      dispatch-delay-ms: ${FI_WORKFLOW_OUTBOX_DISPATCH_DELAY_MS:5000}
    reconciliation:
      delay-ms: ${FI_WORKFLOW_RECONCILIATION_DELAY_MS:600000}
