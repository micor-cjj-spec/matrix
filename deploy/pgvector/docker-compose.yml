services:
  matrix-pgvector:
    image: pgvector/pgvector:pg16
    container_name: matrix-pgvector
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PGVECTOR_DATABASE:-matrix_ai}
      POSTGRES_USER: ${PGVECTOR_USERNAME:-matrix_ai}
      POSTGRES_PASSWORD: ${PGVECTOR_PASSWORD:-change_me}
    ports:
      - "${PGVECTOR_PORT:-5433}:5432"
    volumes:
      - matrix_pgvector_data:/var/lib/postgresql/data
      - ../../sql/bizfi_ai_pgvector_v3.sql:/docker-entrypoint-initdb.d/001-matrix-ai-pgvector.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGVECTOR_USERNAME:-matrix_ai} -d ${PGVECTOR_DATABASE:-matrix_ai}"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  matrix_pgvector_data:
