spring:
  application:
    name: base-service

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  config:
    import: "nacos:${spring.application.name}"

  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:117.72.216.168:8848}
        group: ${NACOS_GROUP:DEV_GROUP}
        namespace: ${NACOS_NAMESPACE:public}
      config:
        server-addr: ${NACOS_ADDR:117.72.216.168:8848}
        file-extension: yaml
        group: ${NACOS_GROUP:DEV_GROUP}
        namespace: ${NACOS_NAMESPACE:public}

bizfi:
  ai:
    model-adapter: ${AI_MODEL_ADAPTER:prompt-http}
    enabled: ${AI_ENABLED:true}
    knowledge-enabled: ${AI_KNOWLEDGE_ENABLED:true}
    fallback-enabled: ${AI_FALLBACK_ENABLED:true}
    max-history-messages: ${AI_MAX_HISTORY_MESSAGES:20}
    max-knowledge-chunks: ${AI_MAX_KNOWLEDGE_CHUNKS:5}
    request-timeout-seconds: ${AI_REQUEST_TIMEOUT_SECONDS:60}
    spring-ai-base-url: ${AI_SERVICE_BASE_URL:http://127.0.0.1:10020/api}
    spring-ai-service-id: ${AI_SERVICE_ID:ai-service}
    spring-ai-discovery-enabled: ${AI_SERVICE_DISCOVERY_ENABLED:false}
    spring-ai-static-fallback-enabled: ${AI_SERVICE_STATIC_FALLBACK_ENABLED:true}
    spring-ai-max-attempts: ${AI_SERVICE_MAX_ATTEMPTS:2}
    spring-ai-circuit-failure-threshold: ${AI_SERVICE_CIRCUIT_FAILURE_THRESHOLD:3}
    spring-ai-circuit-open-seconds: ${AI_SERVICE_CIRCUIT_OPEN_SECONDS:30}
    internal-token: ${AI_INTERNAL_TOKEN:}

matrix:
  scheduler:
    client:
      enabled: ${SCHEDULER_CLIENT_ENABLED:true}
      executor-code: base-service
      executor-name: 基础服务执行器
      scheduler-base-url: ${SCHEDULER_BASE_URL:http://127.0.0.1:8080/api}
      internal-token: ${SCHEDULER_INTERNAL_TOKEN}
      concurrency: ${SCHEDULER_CONCURRENCY:1}
      max-concurrency: ${SCHEDULER_MAX_CONCURRENCY:10}
      heartbeat-interval-ms: ${SCHEDULER_HEARTBEAT_INTERVAL_MS:30000}
      initialize-schema: ${SCHEDULER_INITIALIZE_SCHEMA:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
