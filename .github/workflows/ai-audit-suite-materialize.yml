name: AI Audit Suite Materialize

on:
  push:
    branches:
      - 'agent/add-ai-audit-suite-clean'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout clean branch
        uses: actions/checkout@v4
        with:
          ref: agent/add-ai-audit-suite-clean
          fetch-depth: 0

      - name: Materialize final audit suite
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin agent/add-ai-audit-operator-controls
          cat > /tmp/audit-paths.txt <<'EOF'
          .github/workflows/spring-ai-service-ci.yml
          ai-service/README.md
          ai-service/src/main/java/single/cjj/matrix/ai/api/InternalModelController.java
          ai-service/src/main/java/single/cjj/matrix/ai/api/ModelContracts.java
          ai-service/src/main/java/single/cjj/matrix/ai/service/SpringAiModelGateway.java
          ai-service/src/main/java/single/cjj/matrix/ai/tool/finance/FinanceMonthEndCloseTool.java
          ai-service/src/main/java/single/cjj/matrix/ai/tool/finance/FinanceToolClient.java
          ai-service/src/test/java/single/cjj/matrix/ai/tool/finance/FinanceMonthEndCloseToolTest.java
          ai-service/src/test/java/single/cjj/matrix/ai/tool/finance/FinanceToolClientTest.java
          base-service/src/main/java/single/cjj/bizfi/ai/audit/AiAuditAdminController.java
          base-service/src/main/java/single/cjj/bizfi/ai/audit/AiAuditOperatorContext.java
          base-service/src/main/java/single/cjj/bizfi/ai/audit/AiAuditOperatorPermissionService.java
          base-service/src/main/java/single/cjj/bizfi/ai/audit/AiToolExecutionAuditPageResponse.java
          base-service/src/main/java/single/cjj/bizfi/ai/audit/AiToolExecutionAuditResponse.java
          base-service/src/main/java/single/cjj/bizfi/ai/audit/AiToolExecutionReconciliationResponse.java
          base-service/src/main/java/single/cjj/bizfi/ai/audit/DefaultAiAuditOperatorPermissionService.java
          base-service/src/main/java/single/cjj/bizfi/ai/audit/FinanceAiAuditClient.java
          base-service/src/main/java/single/cjj/bizfi/ai/config/AiProperties.java
          base-service/src/main/java/single/cjj/bizfi/ai/dto/AiToolContext.java
          base-service/src/main/java/single/cjj/bizfi/ai/service/AiOrganizationPermissionService.java
          base-service/src/main/java/single/cjj/bizfi/ai/service/impl/AiChatServiceImpl.java
          base-service/src/main/java/single/cjj/bizfi/ai/service/impl/DefaultAiOrganizationPermissionService.java
          base-service/src/main/java/single/cjj/bizfi/ai/service/impl/DefaultAiToolPolicyService.java
          base-service/src/main/java/single/cjj/bizfi/config/SecurityConfig.java
          base-service/src/main/resources/application.yml
          base-service/src/test/java/single/cjj/bizfi/ai/audit/AiAuditAdminControllerTest.java
          base-service/src/test/java/single/cjj/bizfi/ai/audit/DefaultAiAuditOperatorPermissionServiceTest.java
          base-service/src/test/java/single/cjj/bizfi/ai/audit/FinanceAiAuditClientTest.java
          base-service/src/test/java/single/cjj/bizfi/ai/service/impl/AiChatServiceImplTest.java
          base-service/src/test/java/single/cjj/bizfi/ai/service/impl/DefaultAiOrganizationPermissionServiceTest.java
          base-service/src/test/java/single/cjj/bizfi/ai/service/impl/DefaultAiToolPolicyServiceTest.java
          docs/ai/design/runtime-refactor-phase7.md
          docs/ai/design/runtime-refactor-phase8.md
          docs/ai/design/runtime-refactor-phase9.md
          docs/ai/operations/tool-audit-operator-runbook.md
          fi-service/src/main/java/single/cjj/fi/ai/tool/FinanceAiToolController.java
          fi-service/src/main/java/single/cjj/fi/ai/tool/FinanceAiToolProperties.java
          fi-service/src/main/java/single/cjj/fi/ai/tool/FinanceMonthEndCloseToolRequest.java
