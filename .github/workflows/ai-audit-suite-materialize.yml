          fi-service/src/test/java/single/cjj/fi/ai/tool/audit/DefaultFinanceAiToolAuditServiceTest.java
          fi-service/src/test/java/single/cjj/fi/ai/tool/audit/FinanceAiAuditAccessLogServiceTest.java
          fi-service/src/test/java/single/cjj/fi/ai/tool/audit/FinanceAiAuditControllerTest.java
          fi-service/src/test/java/single/cjj/fi/ai/tool/audit/FinanceAiAuditOperatorGuardTest.java
          sql/bizfi_ai_tool_audit_v1.sql
          sql/bizfi_ai_tool_audit_v2.sql
          sql/bizfi_ai_tool_audit_v3.sql
          EOF

          while IFS= read -r path; do
            git checkout origin/agent/add-ai-audit-operator-controls -- "$path"
          done < /tmp/audit-paths.txt

          rm -f .github/workflows/ai-audit-suite-materialize.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(ai): integrate audit execution and operator controls"
          git push origin HEAD:agent/add-ai-audit-suite-clean
