name: One-time branch cleanup

on:
  push:
    branches:
      - dev
    paths:
      - '.github/workflows/cleanup-non-core-branches.yml'
  pull_request:
    branches:
      - dev
    paths:
      - '.github/branch-cleanup-trigger.txt'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete every branch except dev and main
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t branches < <(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/branches?per_page=100" --jq '.[].name'
          )

          echo "Found ${#branches[@]} branches"
          for branch in "${branches[@]}"; do
            case "$branch" in
              dev|main)
                echo "Keeping $branch"
                ;;
              *)
                echo "Deleting $branch"
                gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}"
                ;;
            esac
          done

          mapfile -t remaining < <(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/branches?per_page=100" --jq '.[].name'
          )

          printf 'Remaining branches:\n'
          printf '%s\n' "${remaining[@]}"

          unexpected=0
          for branch in "${remaining[@]}"; do
            case "$branch" in
              dev|main) ;;
              *)
                echo "Unexpected remaining branch: $branch" >&2
                unexpected=1
                ;;
            esac
          done
          exit "$unexpected"
