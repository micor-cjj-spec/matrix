name: Knowledge Ingestion Diagnostic

on:
  push:
    branches:
      - 'agent/knowledge-phase3b-ingestion'

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Capture Maven output
        id: maven
        shell: bash
        run: |
          set +e
          mvn -B -Dstyle.color=never -pl base-service -am test > maven.log 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          tail -n 160 maven.log > maven-tail.log
          exit 0

      - name: Comment diagnostic result
        env:
          GH_TOKEN: ${{ github.token }}
          EXIT_CODE: ${{ steps.maven.outputs.exit_code }}
        shell: bash
        run: |
          {
            echo "### Phase 3B Maven diagnostic"
            echo
            echo "Exit code: \`$EXIT_CODE\`"
            echo
            echo '```text'
            cat maven-tail.log
            echo '```'
          } > diagnostic-comment.md
          gh pr comment 79 --body-file diagnostic-comment.md
