name: Sales Workflow Integration CI

on:
  pull_request:
    paths:
      - 'erp-service/**'
      - 'workflow-service/**'
      - 'deliverables/erp/014-sales-workflow-link/**'
      - '.github/workflows/sales-workflow-integration-ci.yml'
  push:
    branches: ['dev']
    paths:
      - 'erp-service/**'
      - 'workflow-service/**'
      - 'deliverables/erp/014-sales-workflow-link/**'
      - '.github/workflows/sales-workflow-integration-ci.yml'

jobs:
  workflow-erp-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Test ERP and Workflow together
        run: mvn -q -Dstyle.color=never -pl erp-service,workflow-service -am test
