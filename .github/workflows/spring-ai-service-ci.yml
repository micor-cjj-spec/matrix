name: Spring AI Service CI

on:
  pull_request:
    paths:
      - 'ai-service/**'
      - 'auth-service/**'
      - 'base-service/pom.xml'
      - 'base-service/src/main/java/single/cjj/bizfi/ai/**'
      - 'base-service/src/main/java/single/cjj/bizfi/config/SecurityConfig.java'
      - 'base-service/src/main/java/single/cjj/bizfi/controller/AiAssistantStreamController.java'
      - 'base-service/src/main/java/single/cjj/bizfi/security/JwtAuthenticationFilter.java'
      - 'base-service/src/test/java/single/cjj/bizfi/ai/**'
      - 'base-service/src/test/java/single/cjj/bizfi/security/**'
      - 'base-service/src/main/resources/application.yml'
      - 'fi-service/src/main/java/single/cjj/fi/ai/**'
      - 'fi-service/src/test/java/single/cjj/fi/ai/**'
      - 'fi-service/src/main/resources/application.yml'
      - 'deploy/pgvector/**'
      - 'scripts/apply-dev-db-scripts.sh'
      - 'sql/bizfi_ai_rag_v*.sql'
      - 'sql/bizfi_ai_rag_evaluation_v*.sql'
      - 'sql/bizfi_ai_pgvector_v*.sql'
      - 'sql/bizfi_ai_knowledge_base_v*.sql'
      - 'sql/bizfi_ai_knowledge_ingestion_v*.sql'
      - 'sql/bizfi_ai_knowledge_acl_v*.sql'
      - 'sql/bizfi_ai_tool_audit_v*.sql'
      - 'pom.xml'
      - '.github/workflows/spring-ai-service-ci.yml'
  push:
    branches:
      - 'dev'
      - 'agent/rag-*'
      - 'agent/knowledge-*'
      - 'agent/add-ai-*'
      - 'agent/add-spring-ai-*'
      - 'agent/add-month-end-*'
    paths:
      - 'ai-service/**'
      - 'auth-service/**'
      - 'base-service/pom.xml'
      - 'base-service/src/main/java/single/cjj/bizfi/ai/**'
      - 'base-service/src/main/java/single/cjj/bizfi/config/SecurityConfig.java'
      - 'base-service/src/main/java/single/cjj/bizfi/controller/AiAssistantStreamController.java'
      - 'base-service/src/main/java/single/cjj/bizfi/security/JwtAuthenticationFilter.java'
      - 'base-service/src/test/java/single/cjj/bizfi/ai/**'
      - 'base-service/src/test/java/single/cjj/bizfi/security/**'
      - 'base-service/src/main/resources/application.yml'
      - 'fi-service/src/main/java/single/cjj/fi/ai/**'
      - 'fi-service/src/test/java/single/cjj/fi/ai/**'
      - 'fi-service/src/main/resources/application.yml'
      - 'deploy/pgvector/**'
      - 'scripts/apply-dev-db-scripts.sh'
      - 'sql/bizfi_ai_rag_v*.sql'
      - 'sql/bizfi_ai_rag_evaluation_v*.sql'
      - 'sql/bizfi_ai_pgvector_v*.sql'
      - 'sql/bizfi_ai_knowledge_base_v*.sql'
      - 'sql/bizfi_ai_knowledge_ingestion_v*.sql'
      - 'sql/bizfi_ai_knowledge_acl_v*.sql'
      - 'sql/bizfi_ai_tool_audit_v*.sql'
      - 'pom.xml'
      - '.github/workflows/spring-ai-service-ci.yml'

jobs:
  test-ai-service:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Compile and test ai-service
        run: mvn -B -Dstyle.color=never -pl ai-service test

  test-auth-service:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Compile and test auth-service identity claims
        run: mvn -B -Dstyle.color=never -pl auth-service -am test

  test-base-adapter:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate dev migration script
        run: bash -n scripts/apply-dev-db-scripts.sh

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Compile and test base-service adapter
        run: mvn -B -Dstyle.color=never -pl base-service -am test

  test-finance-tool:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Compile and test finance AI tool
        run: mvn -B -Dstyle.color=never -pl fi-service -am test
