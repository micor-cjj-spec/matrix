name: Sales Authorization CI

on:
  pull_request:
    paths:
      - 'auth-service/**'
      - 'erp-service/**'
      - 'deliverables/auth/**'
      - '.github/workflows/sales-authorization-ci.yml'
  push:
    branches: ['dev']
    paths:
      - 'auth-service/**'
      - 'erp-service/**'
      - 'deliverables/auth/**'
      - '.github/workflows/sales-authorization-ci.yml'

jobs:
  sales-auth-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Test auth-service and erp-service modules
        run: mvn -q -Dstyle.color=never -pl auth-service,erp-service -am test

