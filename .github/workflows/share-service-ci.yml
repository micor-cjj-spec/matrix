name: Share Service CI

on:
  pull_request:
    branches:
      - dev
    paths:
      - 'share-service/**'
      - 'common/**'
      - 'pom.xml'
      - '.github/workflows/share-service-ci.yml'
  push:
    branches:
      - 'feature/shared-operations-*'
    paths:
      - 'share-service/**'
      - 'common/**'
      - 'pom.xml'
      - '.github/workflows/share-service-ci.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Test share service
        run: mvn -B -pl share-service -am test
