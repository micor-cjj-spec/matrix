name: Repository Hygiene CI

on:
  pull_request:
    branches:
      - dev
      - main
  push:
    branches:
      - dev
      - main

concurrency:
  group: repository-hygiene-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  repository-hygiene:
    name: repository-hygiene
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check tracked artifacts and local secrets
        run: bash scripts/ci/check-repository-hygiene.sh

      - name: Upload hygiene report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repository-hygiene-report
          path: hygiene-report.txt
          if-no-files-found: error
          retention-days: 7
