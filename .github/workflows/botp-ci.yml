name: BOTP CI

on:
  pull_request:
    paths:
      - 'botp-service/**'
      - 'fi-service/**'
      - 'common/**'
      - 'deliverables/botp/**'
      - 'pom.xml'
      - '.github/workflows/botp-ci.yml'
  push:
    branches:
      - 'feature/botp-*'
    paths:
      - 'botp-service/**'
      - 'fi-service/**'
      - 'common/**'
      - 'deliverables/botp/**'
      - 'pom.xml'
      - '.github/workflows/botp-ci.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Test BOTP and FI integration
        run: mvn -B -pl botp-service,fi-service -am test
