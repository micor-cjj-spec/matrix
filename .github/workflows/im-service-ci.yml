name: IM Service CI

on:
  push:
    branches: [dev]
    paths:
      - 'pom.xml'
      - 'common/**'
      - 'im-service/**'
      - '.github/workflows/im-service-ci.yml'
  pull_request:
    paths:
      - 'pom.xml'
      - 'common/**'
      - 'im-service/**'
      - '.github/workflows/im-service-ci.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Test IM module
        run: mvn -q -Dstyle.color=never -pl im-service -am test
