server:
  servlet:
    context-path: /api

spring:
  application:
    name: botp-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  config:
    import: "optional:nacos:${spring.application.name}"
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${BOTP_DB_URL:jdbc:mysql://117.72.216.168:3306/matrix_botp?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${BOTP_DB_USERNAME:root}
    password: ${BOTP_DB_PASSWORD:}
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:117.72.216.168:8848}
        group: ${NACOS_GROUP:DEV_GROUP}
        namespace: ${NACOS_NAMESPACE:public}
      config:
        server-addr: ${NACOS_ADDR:117.72.216.168:8848}
        file-extension: yaml
        group: ${NACOS_GROUP:DEV_GROUP}
        namespace: ${NACOS_NAMESPACE:public}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: assign_id

botp:
  persistence:
    mode: ${BOTP_PERSISTENCE_MODE:mysql}
  default-tenant: ${BOTP_DEFAULT_TENANT:default}
  fi-service-url: ${FI_SERVICE_URL:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
