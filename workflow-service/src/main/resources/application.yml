server:
  port: ${SERVER_PORT:10006}
  servlet:
    context-path: /api

spring:
  application:
    name: workflow-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  config:
    import: optional:nacos:${spring.application.name}
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        group: ${NACOS_GROUP:DEV_GROUP}
        namespace: ${NACOS_NAMESPACE:public}
      config:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        file-extension: yaml
        group: ${NACOS_GROUP:DEV_GROUP}
        namespace: ${NACOS_NAMESPACE:public}
  datasource:
    url: ${WORKFLOW_DB_URL:jdbc:mysql://127.0.0.1:3306/matrix_workflow?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${WORKFLOW_DB_USERNAME:root}
    password: ${WORKFLOW_DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

workflow:
  callback:
    signing-secret: ${WORKFLOW_CALLBACK_SECRET:change-me-in-production}
  attachment:
    base-url: ${WORKFLOW_ATTACHMENT_BASE_URL:http://localhost:10006}
    local-root: ${WORKFLOW_ATTACHMENT_LOCAL_ROOT:./data/workflow-attachments}
    signing-secret: ${WORKFLOW_ATTACHMENT_SIGNING_SECRET:matrix-workflow-change-me}
    upload-ttl-seconds: ${WORKFLOW_ATTACHMENT_UPLOAD_TTL_SECONDS:900}
    download-ttl-seconds: ${WORKFLOW_ATTACHMENT_DOWNLOAD_TTL_SECONDS:300}
    max-file-size-bytes: ${WORKFLOW_ATTACHMENT_MAX_FILE_SIZE_BYTES:52428800}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
